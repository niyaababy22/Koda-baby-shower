<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Guest List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="invitation">

  <!-- scattered white baby claws across the pink background -->
  <div class="claw-scatter" aria-hidden="true">
    <svg class="claw claw--1" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--2" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--3" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--4" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--5" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--6" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--7" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--8" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--9" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
    <svg class="claw claw--10" viewBox="0 0 60 60"><use href="#claw-shape"/></svg>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="paw-shape">
        <ellipse cx="30" cy="40" rx="15" ry="12"/>
        <circle cx="12" cy="24" r="6"/>
        <circle cx="24" cy="12" r="6"/>
        <circle cx="38" cy="12" r="6"/>
        <circle cx="50" cy="22" r="6"/>
      </g>
      <g id="claw-shape">
        <ellipse cx="30" cy="42" rx="14" ry="11"/>
        <circle cx="14" cy="25" r="5.5"/>
        <circle cx="26" cy="15" r="5.5"/>
        <circle cx="38" cy="15" r="5.5"/>
        <circle cx="48" cy="23" r="5.5"/>
        <path d="M11 18 L13.5 10" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;"/>
        <path d="M24 8 L26 1" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;"/>
        <path d="M36 8 L38 1" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;"/>
        <path d="M46 16 L49.5 9" style="fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;"/>
      </g>
    </defs>
  </svg>

  <main class="invite-card">
    <span class="badge">Private</span>
    <h1 class="headline">Guest List</h1>
    <p class="subtext">For Jordan &amp; Rakiyyah's eyes only </p>

    <div id="gate">
      <form id="gate-form" class="rsvp-form">
        <div class="field">
          <label for="gate-password">Enter the password</label>
          <input type="password" id="gate-password" required />
        </div>
        <p class="rsvp-hint hidden" id="gate-error" style="color:#c0605f;">That password isn't right — try again.</p>
        <button type="submit" class="btn">View Guest List</button>
      </form>
    </div>

    <div id="guest-content" class="hidden">
      <section class="attending-section" style="border-top:none; padding-top:0;">
        <p class="section-subtext" id="headcount-text">Loading...</p>
        <div class="attending-list" id="attending-list">
          <p class="attending-empty" id="attending-empty">No RSVPs yet.</p>
        </div>
      </section>
    </div>
  </main>

  <button id="scroll-top-btn" class="scroll-top-btn hidden" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5l-7 7h4v7h6v-7h4z" fill="currentColor"/></svg>
  </button>

  <script src="script.js"></script>
  <script type="module" src="guestlist.js"></script>
</body>
</html>
